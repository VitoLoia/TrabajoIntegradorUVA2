    <main class="container mt-4 contact-form">
        <h1>Por favor debajo ingrese sus datos para poder contactarlo</h1>
        <h2>Formulario:</h2>
        <form method="post">
            <div class="form-group">
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="30" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Enviar</button>
        </form>
    </main>

    <footer class="text-center bg-dark text-white py-3">
        <p>&copy; 2025 - Sitio educativo personal</p>
    </footer>
